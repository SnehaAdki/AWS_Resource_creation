name: IaC Policy Check


permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov policy scan
        run: checkov -d .